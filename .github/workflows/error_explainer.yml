name: "Gradle Build Error Explainer"

on:
  workflow_run:
    workflows: ["Android CI"]  # Aapke main CI workflow ka naam
    types:
      - completed

jobs:
  explain-error:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Download Build Logs
        uses: actions/github-script@v7
        with:
          script: |
            let logs = await github.rest.actions.downloadWorkflowRunLogs({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            let fs = require('fs');
            fs.writeFileSync('logs.zip', Buffer.from(logs.data));

      - name: Extract Log File
        run: |
          unzip -q logs.zip -d log_files
          grep -rn "e: " log_files/ || true > error_summary.txt
          grep -rn "FAILURE: Build failed" -A 20 log_files/ >> error_summary.txt || true

      - name: Generate AI Error Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let errorDetails = "Unknown Gradle Error";
            if (fs.existsSync('error_summary.txt')) {
              errorDetails = fs.readFileSync('error_summary.txt', 'utf8').slice(0, 2000);
            }
            
            const summary = `
            ## 🚨 Gradle Build Failure Analysis
            
            **Detected Errors in Logs:**
            \`\`\`text
            ${errorDetails || "Check full workflow logs for details."}
            \`\`\`
            
            ---
            💡 *Tip: Check if any imports, missing XML/Manifest references, or Gradle plugin versions are mismatched.*
            `;
            
            await core.summary.addRaw(summary).write();
