name: Gradle Build Error Explainer

on:
  workflow_run:
    workflows: ["Android CI"]
    types:
      - completed

jobs:
  explain-error:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Fetch Workflow Failure Logs
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch jobs for the failed workflow run
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: owner,
              repo: repo,
              run_id: runId,
            });

            const failedJob = jobs.data.jobs.find(j => j.conclusion === 'failure');
            if (!failedJob) return;

            // Fetch job logs
            const logResponse = await github.rest.actions.downloadJobLogsForWorkflowRun({
              owner: owner,
              repo: repo,
              job_id: failedJob.id,
            });

            const logs = logResponse.data;
            const logLines = logs.split('\n');

            // Extract compilation errors and exceptions
            const errorLines = logLines.filter(line => 
              line.includes('e: ') || 
              line.includes('Unresolved reference') || 
              line.includes('BUILD FAILED') || 
              line.includes('Execution failed for task') ||
              line.includes('OutOfMemoryError')
            );

            const summaryLog = errorLines.length > 0 
              ? errorLines.slice(-15).join('\n') 
              : "Logs mein koi direct compile error text nahi mila. Check karein gradle.properties ya dependencies mismatch hai.";

            // Format Summary in Roman Urdu
            let romanUrduExplanation = "### 🚨 Build Fail Hone Ki Wajah (Roman Urdu Explanation):\n\n";
            
            if (summaryLog.includes("Unresolved reference")) {
              romanUrduExplanation += "👉 **Masla:** Code mein kisi class, library, ya resource variable ka reference missing hai (Import issue ya Resource Name galat hai).\n";
            } else if (summaryLog.includes("OutOfMemoryError") || summaryLog.includes("daemon")) {
              romanUrduExplanation += "👉 **Masla:** Memory (RAM) khatam ho gayi hai. `gradle.properties` mein jvmargs badhane ki zaroorat hai.\n";
            } else if (summaryLog.includes("Execution failed for task")) {
              romanUrduExplanation += "👉 **Masla:** Android Gradle Build Task execute nahi ho saka. Code compile error ya XML file syntax check karein.\n";
            } else {
              romanUrduExplanation += "👉 **Masla:** Gradle build fail ho gayi hai. Neeche diye gaye main errors ko check karein.\n";
            }

            romanUrduExplanation += "\n```text\n" + summaryLog + "\n```";

            core.summary.addRaw(romanUrduExplanation).write();
